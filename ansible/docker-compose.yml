services:
  ansible:
    build: .
    environment:
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL}
      - ALERTMANAGER_RECEIVER_EMAIL=${ALERTMANAGER_RECEIVER_EMAIL}
    volumes:
      - ./:/ansible
      - ${SSH_KEY_PATH}:/keys/homelab_key:ro
      - ${VAULT_PASSWORD_PATH}:/pass.txt:ro
    tty: true
    stdin_open: true