- name: Base setup on all hosts
  hosts: all
  become: true

  tasks:
    - name: Set timezone to Europe/Warsaw
      community.general.timezone:
        name: Europe/Warsaw
        hwclock: UTC

    - name: Restart systemd-timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: restarted

    - name: Wait for system clock synchronization
      ansible.builtin.command:
        cmd: timedatectl show -p NTPSynchronized --value
      register: ntp_sync
      until: ntp_sync.stdout | trim == "yes"
      retries: 30
      delay: 2
      changed_when: false  

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - nano
          - htop
        state: present
