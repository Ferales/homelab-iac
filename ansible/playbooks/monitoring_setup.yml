- name: Start Node Exporter
  hosts: all
  become: true

  roles:
    - node_exporter

- name: Setup and start Prometheus and Grafana containers
  hosts: monitoring
  become: true

  tasks:
    - name: Create Docker network for monitoring stack
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: "{{ prometheus_data_path }}"
        state: directory
        owner: "65534"
        mode: '0755' 

    - name: Create Prometheus rules directory
      ansible.builtin.file:
        path: "{{ prometheus_rules_path }}"
        state: directory
        owner: "65534"
        mode: '0755'

    - name: Create Prometheus configuration file
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_path }}"
        owner: root
        mode: '0644'
      notify: 
        - Reload Prometheus

    - name: Create Prometheus rules file
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ prometheus_rules_path }}/{{ item.dest }}"
        owner: root
        mode: '0644'
      loop:
        - { src: 'templates/prometheus_rules/host_availability.rules.yml', dest: 'host_availability.rules.yml' }
        - { src: 'templates/prometheus_rules/host_resurces.rules.yml', dest: 'host_resurces.rules.yml' }
      notify: 
        - Reload Prometheus

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ grafana_provisioning_path }}/{{ item }}"
        state: directory
        owner: root
        mode: '0755'
      loop:
        - datasources
        - dashboards

    - name: Create Grafana dashboards directory
      ansible.builtin.file:
        path: "{{ grafana_dashboards_path }}"
        state: directory
        owner: root
        mode: '0755'

    - name: Copy Grafana provisioning files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ grafana_provisioning_path }}/{{ item.dest }}"
        owner: root
        mode: '0644'
      loop:
        - { src: 'templates/grafana-provisioning/datasource.yml', dest: 'datasources/datasource.yml' }
        - { src: 'templates/grafana-provisioning/dashboard-provider.yml', dest: 'dashboards/dashboard-provider.yml' }

    - name: Copy Grafana dashboard files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ grafana_dashboards_path }}/{{ item.dest }}"
        owner: root
        mode: '0644'
      loop:
        - { src: 'templates/grafana-provisioning/node_exporter_overview.json', dest: 'node_exporter_overview.json' }

    - name: Create Alertmanager data directory
      ansible.builtin.file:
        path: "{{ alertmanager_data_path }}"
        state: directory
        owner: root
        mode: '0755'

    - name: Create Alertmanager configuration file
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: "{{ alertmanager_config_path }}"
        owner: root
        mode: '0644'
      no_log: true
      notify: 
        - Restart Alertmanager container

    - name: Start Prometheus Docker container
      community.docker.docker_container:
        name: prometheus
        image: "{{ prometheus_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: monitoring
        volumes:
          - "{{ prometheus_config_path }}:/etc/prometheus/prometheus.yml"
          - "{{ prometheus_data_path }}:/prometheus"
          - "{{ prometheus_rules_path }}:/etc/prometheus/rules"

    - name: Start Grafana Docker container
      community.docker.docker_container:
        name: grafana
        image: "{{ grafana_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: monitoring
        ports:
          - "3000:3000"
        volumes:
          - "{{ grafana_provisioning_path }}:/etc/grafana/provisioning"
          - "{{ grafana_dashboards_path }}:/var/lib/grafana/dashboards"
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      no_log: true

    - name: Start Alertmanager Docker container
      community.docker.docker_container:
        name: alertmanager
        image: "{{ alertmanager_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: monitoring
        ports:
          - "9093:9093"
        volumes:
          - "{{ alertmanager_config_path }}:/etc/alertmanager/alertmanager.yml"
          - "{{ alertmanager_data_path }}:/alertmanager"
  
  handlers:
    - name: Reload Prometheus
      ansible.builtin.command:
        cmd: docker restart prometheus

    - name: Restart Alertmanager container
      ansible.builtin.command:
        cmd: docker restart alertmanager